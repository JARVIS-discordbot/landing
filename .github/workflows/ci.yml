name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'clusters.html'
      - 'build/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'clusters.html'
      - 'build/**'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: build

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: build/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run build tests
        run: npm test
